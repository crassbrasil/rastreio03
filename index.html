<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificar Pedido</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background-color: #f0f0f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
    }

    .container {
      text-align: center;
      background-color: #ffffff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 450px;
    }

    h2 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #333;
    }

    .search-box {
      width: 100%;
      margin-bottom: 15px;
    }

    .search-box input {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 5px;
      transition: border-color 0.3s ease;
    }

    .search-box input:focus {
      border-color: #4CAF50;
      outline: none;
    }

    .search-button {
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
    }

    .search-button button {
      width: 100%;
      max-width: 200px;
      padding: 14px;
      background-color: #4CAF50;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .search-button button:hover {
      background-color: #45a049;
    }

    .error {
      color: #ff4d4d;
      font-size: 14px;
      margin-top: 10px;
    }

    @media (max-width: 480px) {
      .search-button button {
        max-width: 100%;
        font-size: 15px;
        padding: 12px;
      }

      .container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Verificar Pedido</h2>
    <div class="search-box">
      <input type="text" id="cpfInput" placeholder="Número do seu pedido" maxlength="11" required>
    </div>
    <div class="search-button">
      <button type="submit" id="submitBtn">Localizar Pedido</button>
    </div>
    <p id="errorMessage" class="error" style="display: none;">Pedido não encontrado. Tente novamente.</p>
  </div>

  <script>
  const validCpfs = [
    '#1096', '#1097', '#1098', '#1415', '#1100', '#1101', '#1102', '#1103', '#1104', '#1105',
'#1106', '#1107', '#1108', '#1109', '#1110', '#1111', '#1112', '#1113', '#1114', '#1115',
'#1116', '#1117', '#1118', '#1119', '#1120', '#1121', '#1122', '#1123', '#1124', '#1125',
'#1126', '#1127', '#1128', '#1129', '#1130', '#1131', '#1132', '#1133', '#1134', '#1135',
'#1136', '#1137', '#1138', '#1139', '#1140', '#1141', '#1142', '#1143', '#1144', '#1145',
'#1146', '#1147', '#1148', '#1149', '#1150', '#1151', '#1152', '#1153', '#1154', '#1155',
'#1156', '#1157', '#1158', '#1159', '#1160', '#1161', '#1162', '#1163', '#1164', '#1165',
'#1166', '#1167', '#1168', '#1169', '#1170', '#1171', '#1172', '#1173', '#1174', '#1175',
'#1176', '#1177', '#1178', '#1179', '#1180', '#1181', '#1182', '#1183', '#1184', '#1185',
'#1186', '#1187', '#1188', '#1189', '#1190', '#1191', '#1192', '#1193', '#1194', '#1195',
'#1196', '#1197', '#1198', '#1199', '#1200'

  ];

  document.getElementById('submitBtn').addEventListener('click', function(event) {
    event.preventDefault();
    const cpf = document.getElementById('cpfInput').value.trim();

    if (validCpfs.includes(cpf)) {
      window.location.href = `https://crassbrasil.github.io/rastreio02/`;
    } else {
      document.getElementById('errorMessage').style.display = 'block';
    }
  });
</script>


</body>
</html>
